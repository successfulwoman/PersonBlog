# =============================================================================
# 生产部署 Compose (服务器 pull 模式) - 仓库参考副本
# =============================================================================
# 线上文件由 .github/workflows/deploy.yml 每次部署时同步至
# 服务器 /opt/personblog/docker-compose.yml。修改本文件后请同步 workflow
# 中 heredoc 的对应内容 (两端保持一致)。
#
# 使用变量:
#   IMAGE     镜像全名, 由部署环境注入 (含 latest / sha tag)
#   BLOG_PORT 宿主机映射端口, 默认 8080
# =============================================================================

services:
  astro-koharu:
    image: ${IMAGE}
    container_name: astro-koharu
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
